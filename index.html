<head>
<meta charset="utf-8">

<meta name="description" content="Tus entrenos de Strava, WODs, marcas y salud en una app.">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: app de móvil, una columna con cabecera de semana, tarjetas por disciplina y barra inferior de pestañas */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#E9EBE6; --fg:#16201B; --muted:#5E6A63; --line:#D6DAD3;
  --run:#2752D9; --box:#D23F6B; --foot:#1B8A5A; --walk:#8A7A3C; --health:#C77A0E; --other:#7A8580;
  --ok:#1B8A5A; --warn:#C77A0E; --bad:#C8333A;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1B; --surface-2:#202925; --fg:#E8ECE9; --muted:#97A39C; --line:#2C3631;
  --run:#7C9BFF; --box:#FF7FA4; --foot:#4FD08F; --walk:#C9B36A; --health:#F2A93B; --other:#8E9A94;
  --ok:#4FD08F; --warn:#F2A93B; --bad:#FF6B70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --surface-2:#202925; --fg:#E8ECE9; --muted:#97A39C; --line:#2C3631;
  --run:#7C9BFF; --box:#FF7FA4; --foot:#4FD08F; --walk:#C9B36A; --health:#F2A93B; --other:#8E9A94;
  --ok:#4FD08F; --warn:#F2A93B; --bad:#FF6B70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;font-weight:800;line-height:1}
h2{font-size:24px;font-weight:700;text-transform:uppercase}
h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:2px}
.small{font-size:13px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .num{font-size:28px;line-height:1.05}
.tile .lab{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);padding:12px 14px;border-radius:10px;font-size:14px}
.banner.bad{border-left-color:var(--bad)} .banner.info{border-left-color:var(--run)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted)}
.badge{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;color:#fff}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--run);outline-offset:2px}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:10px 14px;cursor:pointer}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.ghost{background:transparent;padding:6px 10px;font-size:13px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--fg)}
nav.tabs a[aria-current="page"] svg{stroke:var(--fg)}
.meter{height:10px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface-2);border-radius:9px;padding:6px 4px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.day.today{outline:2px solid var(--fg);outline-offset:-2px}
.day b{font-family:var(--display);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.chip{width:10px;height:10px;border-radius:3px}
.pre{white-space:pre-wrap;font-size:14px;line-height:1.55}
details summary{cursor:pointer;font-weight:600}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800}
.box.done{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{transform:translateY(4px)}to{transform:none}}}


html{color-scheme:light}
body{margin:0;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gear{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);color:var(--fg);margin-left:6px}
.gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
a.item:hover .t{text-decoration:underline}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile.pr{gap:3px;padding:12px 10px}
.tile.pr .big{font-size:30px;line-height:1}
@media (max-width:380px){.tile.pr .big{font-size:25px}}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cd{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--fg);min-width:0}
.cd .num{font-size:34px;line-height:1;color:var(--c)}
.cd-l{display:flex;flex-direction:column;font-size:12.5px;line-height:1.25;min-width:0}
.cd-l b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.card.ev{border-top:4px solid var(--c)}
.cdbig{display:flex;flex-direction:column;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px 12px;flex:none}
.cdbig .num{font-size:40px;line-height:1;color:var(--c)}
.cdbig .lab{font-size:12px;color:var(--muted)}
.btn-photo{display:inline-flex;align-items:center;flex-direction:row;font-size:14px;font-weight:600;color:var(--bg);background:var(--box);border-radius:10px;padding:9px 14px;cursor:pointer}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumb{display:flex;flex-direction:column;gap:4px;align-items:center;flex:none}
.thumb img{width:96px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.phrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.phrow:first-child{border-top:0}
.sugbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;flex-wrap:wrap}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--fg);font-weight:500}
.chk input{width:20px;height:20px}
.res{display:inline-block;margin-top:4px;font-family:var(--display);font-weight:800;font-size:19px;color:var(--ok);letter-spacing:.02em}
.com{font-size:13px;color:var(--fg);background:var(--surface-2);border-radius:4px 10px 10px 10px;padding:5px 9px;margin-top:4px;display:inline-block}
.pcts{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.pct{background:var(--surface-2);border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;align-items:center}
.pct .num{font-size:22px;line-height:1.1}
.pct.hl{outline:2px solid var(--box);outline-offset:-2px}

/* ---------- tokens del cuerpo y héroe ---------- */
:root{--m0:#CDD2CA;--m1:#F5C9D6;--m2:#EE97B0;--m3:#DE5E86;--m4:#B5245A;--bodybase:#DEE2DB;--hero-a:#16201B;--hero-b:#3A1D2C;--hero-fg:#F4F6F3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m0:#34403A;--m1:#5A2A3B;--m2:#8C3557;--m3:#C94377;--m4:#FF7FA4;--bodybase:#28322D;--hero-a:#1D2A24;--hero-b:#4A2236;--hero-fg:#F4F6F3}}
:root[data-theme="dark"]{--m0:#34403A;--m1:#5A2A3B;--m2:#8C3557;--m3:#C94377;--m4:#FF7FA4;--bodybase:#28322D;--hero-a:#1D2A24;--hero-b:#4A2236;--hero-fg:#F4F6F3}
body.noscroll{overflow:hidden}
/* ---------- héroe del resumen ---------- */
.hero{background:radial-gradient(120% 140% at 100% 0%,var(--hero-b) 0%,transparent 60%),var(--hero-a);color:var(--hero-fg);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px -12px rgba(0,0,0,.45)}
.hero .eyebrow{color:var(--hero-fg);opacity:.75}
.glass{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.hero-main{display:flex;align-items:flex-end;gap:12px;color:inherit;text-decoration:none}
.num.huge{font-size:76px;line-height:.85;letter-spacing:-.02em}
.hero-l{display:flex;flex-direction:column;gap:2px;padding-bottom:4px;min-width:0}
.hero-l b{font-size:13px;font-weight:600;opacity:.8}
.hname{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05}
.hdate{font-size:12.5px;opacity:.75}
.hero-next{font-size:13px;opacity:.85}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.hero-stats div{display:flex;flex-direction:column;min-width:0}
.hero-stats b{font-family:var(--display);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-stats span{font-size:11.5px;opacity:.7}
/* ---------- cuerpo ---------- */
.bodygrid{display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);gap:14px;align-items:start}
.flip{perspective:900px;width:100%;max-width:220px;aspect-ratio:200/430;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.flip.small{max-width:130px}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.flip-in.back{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.backf{transform:rotateY(180deg)}
.bodysvg{width:100%;height:100%;display:block;overflow:visible}
@media (prefers-reduced-motion:no-preference){.flip .bodysvg{animation:sway 6s ease-in-out infinite;transform-origin:50% 60%}@keyframes sway{0%,100%{transform:rotateY(-7deg)}50%{transform:rotateY(7deg)}}}
.base path{fill:var(--bodybase)}
.floor{fill:var(--fg);opacity:.08}
.m{cursor:pointer;outline:none}
.m path{stroke:var(--surface);stroke-width:1.3;stroke-linejoin:round;transition:fill .35s ease}
.m.l0 path{fill:var(--m0)}.m.l1 path{fill:var(--m1)}.m.l2 path{fill:var(--m2)}.m.l3 path{fill:var(--m3)}.m.l4 path{fill:var(--m4)}
.m:hover path,.m:focus-visible path{filter:brightness(1.08)}
.m.sel path{stroke:var(--fg);stroke-width:2.4}
.ramp{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.ramp i{width:16px;height:9px;border-radius:3px}
.ramp .r0{background:var(--m0)}.ramp .r1{background:var(--m1)}.ramp .r2{background:var(--m2)}.ramp .r3{background:var(--m3)}.ramp .r4{background:var(--m4)}
.musrow{display:grid;grid-template-columns:86px minmax(0,1fr);align-items:center;gap:8px;background:none;border:0;padding:4px 0;font-size:13px;font-weight:500;text-align:left;color:var(--fg)}
.flipbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.seg button{padding:6px 10px;font-size:12px}
/* ---------- box ---------- */
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.statrow div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.statrow .num{font-size:28px;line-height:1}
.statrow .lab{font-size:11.5px;color:var(--muted)}
.addbtn{background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700}
.wodlist{display:flex;flex-direction:column;gap:8px}
.wodc{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:12px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:10px 12px;color:var(--fg);font-weight:400}
.wodc:hover{border-color:var(--line)}
.wdate{display:flex;flex-direction:column;align-items:center;background:var(--surface);border-radius:10px;padding:6px 0;line-height:1}
.wdate b{font-family:var(--display);font-size:22px}
.wdate span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.wname{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wodc .res{font-size:18px;margin:0}
.wodc .com{margin:0;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchips{display:flex;flex-wrap:wrap;gap:4px}
.mchips i{font-style:normal;font-size:11px;font-weight:600;color:var(--box);background:color-mix(in srgb,var(--box) 12%,transparent);padding:2px 7px;border-radius:999px}
.wmini{width:46px;height:96px}
.wmini .m path{stroke-width:2}
.res.big{font-size:30px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:10px 12px;color:var(--fg);font-weight:400;min-width:0}
.mtile:hover{border-color:var(--line)}
.mname{font-size:12.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mval b{font-family:var(--display);font-size:26px}
.mval{font-size:13px;color:var(--muted)}
.mtag{font-size:10.5px;font-weight:700;color:var(--box);text-transform:uppercase;letter-spacing:.06em}
details.fold summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:10px;transition:transform .2s}
details.fold[open] summary::after{transform:rotate(-135deg)}
details.fold:not([open]){gap:0}
/* ---------- panel inferior ---------- */
.sheet{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,12,.45);opacity:0;transition:opacity .25s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25);max-width:720px;margin:0 auto;overscroll-behavior:contain}
.sheet.open .sheet-bg{opacity:1}
.sheet.open .sheet-panel{transform:none}
.sheet-grip{width:42px;height:5px;border-radius:999px;background:var(--line);margin:6px auto 10px;cursor:pointer}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h3{font-size:22px}
.iconbtn{width:34px;height:34px;padding:0;border-radius:50%;display:grid;place-items:center;flex:none}
button.big{padding:13px;font-size:16px}
.actlist{display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:14px;color:var(--fg);font-weight:400;cursor:pointer;flex-direction:row}
.act:hover{border-color:var(--line)}
.act b{display:block;font-size:15px}
.act small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--box);flex:none}
.ico svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.detgrid{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:start}
.wtext{background:var(--surface-2);border-radius:12px;padding:12px;font-size:13.5px}
.acc{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
@media (max-width:360px){.bodygrid{grid-template-columns:1fr}.flip{max-width:180px;margin:0 auto}}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface-2);border-radius:14px;padding:10px 6px 4px}
.twin>div{display:flex;flex-direction:column;align-items:center;gap:2px}
.twin .bodysvg{max-height:240px}
.twin .m{cursor:default}
.hyx{display:flex;flex-direction:column;gap:10px}
.hyx-run{background:color-mix(in srgb,var(--run) 10%,transparent);border-radius:12px;padding:10px 12px;font-size:13.5px}
.hyx-list{display:flex;flex-direction:column}
.hyx-st{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hyx-st:first-child{border-top:0}
.hyx-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--box);color:#fff;font-family:var(--display);font-weight:800}
/* ---------- carreras ---------- */
.runlist{display:flex;flex-direction:column;gap:8px}
.runc{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:10px 12px;color:var(--fg);font-weight:400}
.runc:hover{border-color:var(--line)}
.rmap{width:56px;height:56px;background:var(--surface);border-radius:12px;display:block}
.rthumb{width:56px;height:56px;display:block}
.rbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.rname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rstats{font-size:13px;color:var(--muted)} .rstats b{color:var(--fg);font-family:var(--display);font-size:16px}
.routesmap{height:280px;border-radius:14px;overflow:hidden;background:var(--surface-2);z-index:0}
.runmap{height:260px;border-radius:14px;overflow:hidden;background:var(--surface-2);z-index:0}
.leaflet-container{font-family:var(--body);background:var(--surface-2)}
.leaflet-tile-pane{filter:grayscale(.75) saturate(.7) contrast(.92) brightness(1.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(.7) brightness(.85) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(.7) brightness(.85) contrast(.9)}
.leaflet-control-attribution{font-size:10px}
.pscale{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.pscale i{flex:1;height:7px;border-radius:999px;background:linear-gradient(90deg,#5B7BFF,#4FB3D9,#F2C14E,#F08A4B,#E0436F)}
.rstatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.rstatgrid div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.rstatgrid b{font-family:var(--display);font-size:22px;line-height:1.1}
.rstatgrid span{font-size:11.5px;color:var(--muted)}
.mchips.run i{color:var(--run);background:color-mix(in srgb,var(--run) 12%,transparent);font-size:12px;padding:3px 9px}
.mchips.run i.pr{color:#fff;background:var(--box)}
.splits{display:flex;flex-direction:column;gap:4px}
.split{display:grid;grid-template-columns:22px minmax(0,1fr) 44px 46px;gap:8px;align-items:center;font-size:13px}
.split .k{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.split .bar{height:14px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.split .bar i{display:block;height:100%;background:var(--run);opacity:.75;border-radius:5px}
.split.best .bar i{background:var(--box);opacity:1}
.split .pv{font-family:var(--display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.split .el{font-size:11px;color:var(--muted);text-align:right}
.split .el.up{color:var(--warn)}
/* ---------- box extra ---------- */
.cal{display:block;width:100%;height:auto}
.cal text{fill:var(--muted);font-size:9px;font-family:var(--body)}
.bal .balbar{height:12px;border-radius:999px;background:color-mix(in srgb,var(--run) 55%,transparent);overflow:hidden;margin-top:4px}
.bal .balbar i{display:block;height:100%;background:var(--box);border-radius:999px 0 0 999px}
.radar{max-width:320px;margin:0 auto}
.radar text{font-size:11px}

/* ---------- Hoy ---------- */
.today{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.today::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.today .tk{font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:4px 10px;border-radius:999px}
.today .tt{font-size:32px;line-height:1.02;text-transform:none}
.today .td{font-size:15px}
.why{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.ck{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.ck summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--fg)}
.ckrow{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.ckseg{display:flex;gap:4px}
.ckseg button{flex:1;padding:8px 4px;font-size:12.5px;border-radius:9px}
.ckseg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.addbtn.soft{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
/* ---------- planificadores ---------- */
.hxsum{background:var(--surface-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.num.huge2{display:block;font-family:var(--display);font-weight:800;font-size:54px;line-height:1}
.num.huge2 small{font-size:22px;color:var(--muted)}
.hxs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hxs div{display:flex;flex-direction:column}.hxs b{font-family:var(--display);font-size:20px}.hxs span{font-size:11.5px;color:var(--muted)}
.hxbar{width:100%;height:18px;border-radius:6px;overflow:hidden;display:block}
.hxrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hxrow span{display:flex;flex-direction:column}.hxrow small{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;padding:0;border-radius:50%;font-size:20px;line-height:1}
.stepper b{font-family:var(--display);font-size:22px;min-width:58px;text-align:center}
.stepper.sm button{width:32px;height:32px;font-size:17px}.stepper.sm b{font-size:18px;min-width:44px}
.hxst{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hxst input[type=range]{flex:1;accent-color:var(--box);padding:0;border:0;background:none}
.kmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.kmc{background:var(--surface-2);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;line-height:1.15;position:relative}
.kmc .k{font-size:11px;color:var(--muted)}.kmc b{font-family:var(--display);font-size:19px}.kmc small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.kmc.gel::after,.gelmark{content:"";width:9px;height:9px;border-radius:50%;background:var(--warn);display:inline-block}
.kmc.gel::after{position:absolute;top:7px;right:7px}
.storyimg{width:min(100%,320px);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
/* ---------- fluidez ---------- */
@media (prefers-reduced-motion:no-preference){
  .view.from-right{animation:inR .28s cubic-bezier(.2,.8,.2,1)}
  .view.from-left{animation:inL .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes inR{from{transform:translateX(24px)}to{transform:none}}
  @keyframes inL{from{transform:translateX(-24px)}to{transform:none}}
  button,.wodc,.runc,.mtile,.act{transition:transform .12s ease,background-color .2s,border-color .2s}
  button:active,.wodc:active,.runc:active,.mtile:active,.act:active{transform:scale(.97)}
}
nav.tabs a{position:relative}
nav.tabs a[aria-current="page"]::before{content:"";position:absolute;top:6px;width:52px;height:30px;border-radius:999px;background:color-mix(in srgb,var(--box) 14%,transparent);z-index:-1}
nav.tabs a[aria-current="page"] svg{stroke:var(--box)}
nav.tabs a[aria-current="page"]{color:var(--fg)}
nav.tabs .in{isolation:isolate}

/* =========== LOOK & FEEL v2: luminoso, limpio, con sombras suaves =========== */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#F0F2F7; --fg:#151826; --muted:#6B7184; --line:#E4E7EF;
  --run:#3366FF; --box:#FF4D7D; --foot:#14B87A; --other:#8A90A2; --ok:#14A86F; --warn:#F08C1A; --bad:#E5484D;
  --m0:#DFE3EC; --m1:#FFD3DF; --m2:#FF9DB8; --m3:#FF6A93; --m4:#E3285E; --bodybase:#E8EBF2;
  --hero:linear-gradient(135deg,#FF8A4C 0%,#FF4D7D 55%,#E0368F 100%); --hero-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(21,24,38,.04),0 8px 24px rgba(21,24,38,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F15; --surface:#171A23; --surface-2:#20242F; --fg:#EEF0F6; --muted:#9097AB; --line:#2A2F3C;
  --run:#7C9BFF; --box:#FF7FA4; --foot:#3FD69B; --other:#8E95A8; --ok:#3FD69B; --warn:#FFB259; --bad:#FF6B70;
  --m0:#2A2F3C; --m1:#4A2534; --m2:#7D2D4C; --m3:#C23D6D; --m4:#FF7FA4; --bodybase:#232733;
  --hero:linear-gradient(135deg,#E2703B 0%,#E03C6C 55%,#B92C78 100%); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F15; --surface:#171A23; --surface-2:#20242F; --fg:#EEF0F6; --muted:#9097AB; --line:#2A2F3C;
  --run:#7C9BFF; --box:#FF7FA4; --foot:#3FD69B; --other:#8E95A8; --ok:#3FD69B; --warn:#FFB259; --bad:#FF6B70;
  --m0:#2A2F3C; --m1:#4A2534; --m2:#7D2D4C; --m3:#C23D6D; --m4:#FF7FA4; --bodybase:#232733;
  --hero:linear-gradient(135deg,#E2703B 0%,#E03C6C 55%,#B92C78 100%); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg)}
.wrap{padding-block:18px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
.stack{gap:16px}
.card,.today,.statrow div{border:0;box-shadow:var(--shadow);border-radius:20px}
.card{padding:18px}
h2{font-size:22px;letter-spacing:.02em}
.tile,.wodc,.runc,.mtile,.act,.hxst,.kmc,.rstatgrid div,.twin,.wtext,.hxsum{border-radius:14px}
nav.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.gear{border:0;background:var(--surface);box-shadow:var(--shadow)}
/* héroe con degradado */
.hero{background:var(--hero);color:var(--hero-fg);box-shadow:0 14px 34px -14px rgba(255,77,125,.55)}
.hero .eyebrow{color:var(--hero-fg);opacity:.85}
.glass{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35)}
.hero-stats{border-top-color:rgba(255,255,255,.3)}
/* notas ocultas tras ⓘ */
#app .note{display:none;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:0}
#app .notes-on .note{display:block}
#sheet .note{font-size:13px;color:var(--muted)}
.nfo{width:20px;height:20px;padding:0;margin-left:8px;border-radius:50%;font:700 12px/18px var(--body);font-style:italic;vertical-align:middle;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);text-transform:none}
.notes-on .nfo{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* Hoy */
.today{padding:18px 18px 14px}
.today .tt{font-size:34px}
.whyd summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600}
.addbtn.foot{background:var(--foot);align-self:flex-start}
.form{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:14px;padding:10px 12px}
.formring{display:flex;align-items:center;gap:12px}
.ring{width:56px;height:56px;flex:none}
.tips{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:16px;padding:12px 6px;font-size:13px;font-weight:600;color:var(--fg)}
.quick svg{width:24px;height:24px;fill:none;stroke:var(--box);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.quick button:first-child svg{stroke:var(--foot)}
.quick button:last-child svg{stroke:var(--run)}
/* fútbol */
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segopt{position:relative;display:block;color:var(--fg);font-size:14px}
.segopt input{position:absolute;opacity:0;pointer-events:none}
.segopt span{display:block;text-align:center;padding:10px;border-radius:10px;background:var(--surface-2);font-weight:600}
.segopt input:checked+span{background:var(--foot);color:#fff}
.segopt input:focus-visible+span{outline:2px solid var(--run)}
.rng{accent-color:var(--foot);padding:0;border:0;background:none}

.daypick button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:var(--surface-2);border:0;font-weight:600}
.daypick button small{font-size:10px;font-weight:500;color:var(--muted)}
.daypick button.entreno{background:color-mix(in srgb,var(--foot) 18%,transparent);color:var(--foot)}
.daypick button.partido{background:var(--foot);color:#fff}
.daypick button.partido small{color:#fff}

/* ---------- fútbol ---------- */
.foothero{background:linear-gradient(135deg,#0FB57C 0%,#14A3A0 60%,#2D7DE0 100%);box-shadow:0 14px 34px -14px rgba(15,181,124,.55)}
.fstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fstats div{display:flex;flex-direction:column}
.fstats b{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
.fstats span{font-size:12px;opacity:.85}
.addbtn.wide{align-self:stretch;padding:14px;font-size:15px;border-radius:16px}
.futc{display:grid;grid-template-columns:46px minmax(0,1fr) 8px;gap:12px;align-items:center;text-align:left;background:var(--surface-2);border:0;border-radius:14px;padding:10px 12px;color:var(--fg);font-weight:400}
.ftag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--foot) 16%,transparent);color:var(--foot)}
.ftag.p{background:var(--foot);color:#fff}
.fline{font-size:13.5px;color:var(--muted)} .fline b{color:var(--fg)}
.futc .com{margin:0;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.effort{width:8px;height:44px;border-radius:999px;background:var(--line);position:relative;overflow:hidden}
.effort i{position:absolute;left:0;right:0;bottom:0;height:var(--e);background:var(--foot);border-radius:999px}

.list .itembtn:first-child{border-top:0}
nav.tabs a{font-size:10.5px}

/* ---------- correr v2 ---------- */
.runhero{background:linear-gradient(135deg,#2F5BFF 0%,#3D8BFF 55%,#22B5E8 100%);box-shadow:0 14px 34px -14px rgba(51,102,255,.55)}
.prgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.prt{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;min-width:0;overflow:hidden;color:var(--fg);background:var(--surface-2)}
.prt::after{content:"";position:absolute;inset:auto -30% -45% auto;width:110px;height:110px;border-radius:50%;background:var(--pc);opacity:.12}
.prt.c5{--pc:#22B5E8}.prt.c10{--pc:#3366FF}.prt.c21{--pc:#8B5CF6}
.prt .dist{font-family:var(--display);font-weight:800;font-size:15px;color:var(--pc);letter-spacing:.04em}
.prt .medal{width:22px;height:22px;color:var(--pc)} .prt .medal svg{width:100%;height:100%}
.ptime{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.psub{font-size:11.5px;color:var(--muted)}
.psrc{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delta{align-self:flex-start;font-size:11px;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);padding:1px 7px;border-radius:999px;margin:2px 0}

@media (max-width:380px){.ptime{font-size:25px}.ptime.long{font-size:21px}}
.lvl{display:flex;flex-direction:column;gap:8px}
.lvr{display:grid;grid-template-columns:58px minmax(0,1fr) 78px 62px;gap:8px;align-items:center}
.ll{font-size:13px;font-weight:600}
.lb{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.lb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#22B5E8,#3366FF)}
.lt{display:flex;flex-direction:column;line-height:1.1}.lt b{font-family:var(--display);font-size:18px}.lt small{font-size:11px;color:var(--muted)}
.ld{font-size:11.5px;font-weight:700;text-align:right;color:var(--muted)}.ld.up{color:var(--ok)}
.trend{font-size:13px}.trend b{color:var(--warn)}.trend.up b{color:var(--ok)}
.zbar{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px}.zbar i{flex:1}
.zlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.zr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.zd{color:#fff;font:800 12px var(--display);text-align:center;border-radius:6px;padding:2px 0}
.zn{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zr b{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
@media (max-width:380px){.zlist{grid-template-columns:1fr}}
.runc{background:var(--surface-2);border:0}
.rmap{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}

[hidden]{display:none!important}
/* =========== APP v3: navegación flotante, inicio bento, gestos =========== */
:root{--nav-h:68px}
.wrap{padding-block:14px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
header.top{align-items:center;margin-bottom:16px}
.tleft{display:flex;align-items:center;gap:10px;min-width:0}
h1{font-size:32px}
.back{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:0;box-shadow:var(--shadow);flex:none}
.back svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--hero);color:#fff;font:800 18px var(--display);box-shadow:var(--shadow);margin-left:8px;text-decoration:none;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:64px;height:64px;font-size:28px;margin:0}
.profile{display:flex;align-items:center;gap:14px;padding:4px 2px}
/* barra compacta al hacer scroll */
.cbar{position:fixed;left:0;right:0;top:0;z-index:15;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;text-align:center;font:700 17px var(--display);letter-spacing:.02em;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);transform:translateY(-100%);transition:transform .25s ease}
body.scrolled .cbar{transform:none}
/* tirar para actualizar */
#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translate(-50%,0);width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;opacity:0;z-index:16;pointer-events:none}
#ptr svg{width:20px;height:20px;fill:none;stroke:var(--box);stroke-width:2.2;stroke-linecap:round}
#ptr.spin{opacity:1!important;animation:spin .8s linear infinite}
@keyframes spin{to{transform:translate(-50%,40px) rotate(360deg)}}
/* barra inferior flotante */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:0;border:0;border-radius:24px;background:color-mix(in srgb,var(--surface) 86%,transparent);box-shadow:0 10px 30px rgba(21,24,38,.14);max-width:520px;margin:0 auto}
nav.tabs .in{grid-template-columns:repeat(2,1fr) 72px repeat(2,1fr);height:var(--nav-h);align-items:center}
nav.tabs a{font-size:11px}
nav.tabs a[aria-current="page"]::before{top:8px;width:54px;height:32px}
.fab{width:56px;height:56px;justify-self:center;border-radius:50%;border:0;padding:0;background:var(--hero);display:grid;place-items:center;box-shadow:0 10px 22px -6px rgba(255,77,125,.6);transform:translateY(-14px)}
.fab svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round}
.fab:active{transform:translateY(-14px) scale(.94)}
#toast{bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px))}
/* bento */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bt{position:relative;display:flex;flex-direction:column;gap:4px;min-height:132px;padding:14px;border-radius:22px;text-decoration:none;color:#fff;overflow:hidden;box-shadow:var(--shadow);isolation:isolate}
.bt::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;right:-40px;bottom:-60px;background:rgba(255,255,255,.14);z-index:-1}
.bt.wide{grid-column:1/-1;min-height:0}
.bt .go{position:absolute;top:10px;right:14px;font-size:22px;opacity:.7}
.bl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.bsub{font-size:12.5px;opacity:.9}
.bname{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
.bname.sm{font-size:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brow{display:flex;align-items:flex-end;gap:12px}
.bnum{font-family:var(--display);font-weight:800;font-size:64px;line-height:.85}
.bcol{display:flex;flex-direction:column;gap:2px;min-width:0;padding-bottom:2px}
.bcol b{font-size:13px;opacity:.85}
.bbig{font-size:14px;opacity:.95}.bbig b{font-family:var(--display);font-size:40px;line-height:1}
.bres{font-family:var(--display);font-weight:800;font-size:24px;color:#fff;background:rgba(255,255,255,.18);align-self:flex-start;padding:0 8px;border-radius:8px}
.b-goal{background:var(--hero)}
.b-week{background:linear-gradient(140deg,#8B5CF6,#6D4AE0);align-items:flex-start}
.b-week .mring{width:64px;height:64px;color:#fff;margin:2px 0}
.b-run{background:linear-gradient(140deg,#3366FF,#22B5E8)}
.b-box{background:linear-gradient(140deg,#FF4D7D,#FF8A4C)}
.b-foot{background:linear-gradient(140deg,#14B87A,#14A3A0)}
.b-body{background:var(--surface);color:var(--fg)}
.b-body::after{background:color-mix(in srgb,var(--box) 10%,transparent)}
.b-body .bl{color:var(--muted)}
.bfig{display:block;height:84px;align-self:center}.bfig .bodysvg{height:100%;width:auto}
.b-pr{background:var(--surface);color:var(--fg)}
.b-pr::after{background:color-mix(in srgb,var(--run) 10%,transparent)}
.b-pr .bl{color:var(--muted)}
.prmini{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.prmini span{flex-direction:row!important;justify-content:space-between;align-items:baseline}
.prmini span{display:flex;flex-direction:column}.prmini small{font-size:12px;color:var(--muted);font-weight:700}.prmini b{font-family:var(--display);font-size:21px}
.bthumb{position:absolute;right:12px;bottom:12px;width:44px;height:44px;background:rgba(255,255,255,.22);border-radius:12px}
.bthumb .rthumb{width:44px;height:44px}.bthumb path{stroke:#fff}
@media (prefers-reduced-motion:no-preference){ .bt{transition:transform .15s ease} .bt:active{transform:scale(.97)} .bento .bt{animation:pop .4s cubic-bezier(.2,.8,.2,1) both} .bento .bt:nth-child(2){animation-delay:.04s}.bento .bt:nth-child(3){animation-delay:.08s}.bento .bt:nth-child(4){animation-delay:.12s}.bento .bt:nth-child(5){animation-delay:.16s}.bento .bt:nth-child(6){animation-delay:.2s}.bento .bt:nth-child(7){animation-delay:.24s} @keyframes pop{from{transform:translateY(8px) scale(.98)}to{transform:none}} }
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px -4px}
.linkbtn{background:none;border:0;padding:0;color:var(--box);font-weight:700;font-size:14px}
/* esqueletos */
.sk{border-radius:20px;background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sh 1.2s ease-in-out infinite}
.sk-hoy{height:170px}.sk-t{height:130px}.sk-card{height:220px}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
/* bienvenida */
#onb{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex}
.onb{margin:auto;max-width:420px;width:100%;padding:calc(env(safe-area-inset-top,0px) + 40px) 28px calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.onb-art{width:160px;height:160px;border-radius:44px;display:grid;place-items:center;background:var(--hero);box-shadow:0 20px 40px -16px rgba(255,77,125,.6);margin-bottom:10px}
.onb-art.a1{background:linear-gradient(140deg,#8B5CF6,#3366FF)}.onb-art.a2{background:linear-gradient(140deg,#14B87A,#22B5E8)}
.onb-art svg{width:76px;height:76px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.onb h1{font-size:34px}.onb p{color:var(--muted);font-size:16px;max-width:32ch}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .2s}.dots i.on{width:22px;background:var(--box)}
.onb .primary{width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="tleft"><button class="back" id="back" data-act="back" aria-label="Volver" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="stack" style="gap:2px"><span class="eyebrow" id="hdrEyebrow">Cuaderno de entreno</span><h1 id="hdrTitle">Hola</h1></div></div>
    <div class="status" id="status"></div>
  </header>
  <main id="app"></main>
</div>
<div id="toast" role="status" hidden></div>
<div class="cbar" aria-hidden="true"><span id="cbarTitle"></span></div>
<div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></div>
<div id="onb" hidden></div>
<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <a href="#resumen" data-v="resumen"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Inicio</a>
    <a href="#correr" data-v="correr"><svg viewBox="0 0 24 24"><circle cx="14" cy="4.5" r="2"/><path d="M6 20l3-5 3 2 1-5 3 3h3M9 11l3-3 3 1"/></svg>Correr</a>
    <button class="fab" data-sheet="quick" aria-label="Añadir"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#box" data-v="box"><svg viewBox="0 0 24 24"><path d="M2 12h2M20 12h2M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/></svg>Box</a>
    <a href="#futbol" data-v="futbol"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10zM12 3v4M20.5 9.5 16 10M17 19l-2.5-4.5M7 19l2.5-4.5M3.5 9.5 8 10"/></svg>Fútbol</a>
  </div>
</nav>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" data-close></div>
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="iconbtn" data-close aria-label="Cerrar">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<input id="ocrFile" type="file" accept="image/*" hidden>
<input id="bulkFiles" type="file" accept="image/*" multiple hidden>
